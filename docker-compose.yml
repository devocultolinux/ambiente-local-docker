services:
  mongodb:
    image: mongo:8.0.5
    container_name: mongodb
    profiles: ["dev"]
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGO_INITDB_DATABASE}
    ports:
      - "27017:27017"
  postgres:
    image: postgres:18.6-alpine
    container_name: postgres
    profiles: ["ic","dev"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:8.8.3-alpine
    container_name: redis
    profiles: ["dev"]
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    deploy:
      resources:
        limits:
          memory: 256M
  redis-ui:
    image: redis/redisinsight:3.8.0
    container_name: redis-ui
    profiles: ["dev"]
    ports:
      - "8083:5540"
    depends_on:
      - redis
  kafka:
    image: confluentinc/cp-kafka:8.3.2
    container_name: kafka
    profiles: ["dev"]
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_TRANSACTION_STATE_LOG_REREPLICATION_FACTOR=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:29093
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LOG_DIRS=/tmp/kraft-combined-logs
      - CLUSTER_ID=${ID_CLUSTER_KAFKA}
      - KAFKA_HEAP_OPTS=-Xmx256m -Xms64m
    ports:
      - "9092:9092"
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    profiles: ["dev"]
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:29092
      - KAFKA_CLUSTERS_0_ZOOKEEPER=''
      - SERVER_PORT=8081
    ports:
      - "8081:8081"
    depends_on:
      kafka:
        condition: service_started
  opensearch:
    image: opensearchproject/opensearch:2.19.6
    container_name: opensearch
    profiles: ["dev"]
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch
      - bootstrap.memory_lock=false
      - discovery.type=single-node
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${SENHA_OPENSEARCH}
      - action.auto_create_index=true
      - plugins.security.disabled=false
      - plugins.security.ssl.transport.enabled=true
      - plugins.security.ssl.http.enabled=false
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      - plugins.ml_commons.only_run_on_ml_node=true
    ports:
      - "9200:9200"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
  dashboard:
    image: opensearchproject/opensearch-dashboards:2.19.6
    container_name: dashboard
    profiles: ["dev"]
    volumes:
      - ./dashboard/opensearch_dashboards.yml:/usr/share/opensearch-dashboards/config/opensearch_dashboards.yml:ro
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
    ports:
      - "5601:5601"
    depends_on:
      opensearch:
        condition: service_started
  logstash:
    image: opensearchproject/logstash-oss-with-opensearch-output-plugin:8.9.0
    container_name: logstash
    profiles: ["dev"]
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
    environment:
      - LS_JAVA_OPTS=-Xmx192m -Xms64m
    ports:
      - "1514:1514/udp"
      - "1514:1514/tcp"
    depends_on:
      opensearch:
        condition: service_started
  sonarqube:
    image: sonarqube:26.9.0.129388-community
    container_name: sonarqube
    profiles: ["ic"]
    volumes:
      - ./sonarqube/extensions:/opt/sonarqube/extensions
    environment:
      - SONAR_JDBC_USERNAME=${SONARQUBE_JDBC_USERNAME}
      - SONAR_JDBC_PASSWORD=${SONARQUBE_JDBC_PASSWORD}
      - SONAR_JDBC_URL=${SONARQUBE_JDBC_URL}
      - sonar.search.javaOpts=-Xms512m -Xmx512m
    ports:
      - "9001:9000"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2000M
  jenkins:
    image: jenkins/jenkins:lts-alpine
    container_name: jenkins
    profiles: ["ic"]
    ports:
      - "8080:8080"
      - "50000:50000"
    environment:
      TZ: America/Sao_Paulo
      JAVA_OPTS: >-
        -Duser.timezone=America/Sao_Paulo
        -Dhudson.security.HudsonPrivateSecurityRealm.ID_REGEX=[a-zA-Z0-9._-]+
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
  nexus:
    image: sonatype/nexus3:3.96.4-alpine
    container_name: nexus
    profiles: ["ic"]
    ports:
      - "8082:8081"
    environment:
      TZ: America/Sao_Paulo